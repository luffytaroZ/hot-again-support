<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hot Again Support</title>
  <style>
    :root { color-scheme: light; --ink:#321a2a; --berry:#6e294f; --pink:#f9dfe5; --paper:#fff9f8; }
    * { box-sizing: border-box; }
    body { margin:0; font:17px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:var(--ink); background:linear-gradient(145deg,var(--paper),var(--pink)); min-height:100vh; }
    main { width:min(720px,calc(100% - 40px)); margin:0 auto; padding:72px 0; }
    .brand { font-size:14px; letter-spacing:.34em; font-weight:700; }
    h1 { font-size:clamp(42px,9vw,72px); line-height:.98; letter-spacing:-.05em; margin:44px 0 18px; }
    h2 { margin-top:38px; }
    p,li { color:#715e69; }
    nav { display:grid; gap:12px; margin-top:38px; }
    a { color:var(--berry); font-weight:700; }
    nav a { padding:18px 20px; border-radius:18px; background:rgba(255,255,255,.72); text-decoration:none; border:1px solid white; }
    .back { display:inline-block; margin-bottom:28px; }
    footer { margin-top:50px; font-size:14px; color:#806b77; }
  </style>
</head>
<body><main>
  <div class="brand">HOT AGAIN</div>
  <h1>Help when you need it.</h1>
  <p>Find our privacy policy, terms, and contact details below.</p>
  <nav>
    <a href="privacy.html">Privacy Policy</a>
    <a href="terms.html">Terms of Use</a>
    <a href="support.html">Support</a>
  </nav>
  <footer>© 2026 Hot Again</footer>
</main></body>
</html>
